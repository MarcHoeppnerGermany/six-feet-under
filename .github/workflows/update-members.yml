name: Update Discord Members

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  update-members:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/lotr-tribe-website-2qArB

      - name: Fetch Discord Members
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '531795681623670785'
        run: |
          set -e

          API="https://discord.com/api/v10"
          AUTH="Authorization: Bot ${DISCORD_BOT_TOKEN}"

          # Fetch members (paginated)
          ALL_MEMBERS="[]"
          AFTER="0"

          while true; do
            RESPONSE=$(curl -sf -H "$AUTH" -H "User-Agent: SFU-Bot/1.0" \
              "$API/guilds/$DISCORD_GUILD_ID/members?limit=1000&after=$AFTER")

            BATCH_SIZE=$(echo "$RESPONSE" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")

            if [ "$BATCH_SIZE" = "0" ]; then
              break
            fi

            ALL_MEMBERS=$(echo "$ALL_MEMBERS" "$RESPONSE" | python3 -c "
          import sys, json
          a = json.loads(sys.stdin.readline())
          b = json.loads(sys.stdin.readline())
          print(json.dumps(a + b))
          ")

            if [ "$BATCH_SIZE" -lt 1000 ]; then
              break
            fi

            AFTER=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)[-1]['user']['id'])")
          done

          # Fetch roles
          ROLES=$(curl -sf -H "$AUTH" -H "User-Agent: SFU-Bot/1.0" \
            "$API/guilds/$DISCORD_GUILD_ID/roles")

          # Process into members.json
          python3 << PYEOF
          import json
          from datetime import datetime, timezone

          with open('/dev/stdin', 'r') as f:
              pass

          members_raw = json.loads('''$ALL_MEMBERS''')
          roles_raw = json.loads('''$ROLES''')

          role_map = {r['id']: r for r in roles_raw}
          roles_sorted = sorted(roles_raw, key=lambda r: r.get('position', 0), reverse=True)

          rank_order = {}
          for r in roles_sorted:
              if r['name'] != '@everyone':
                  rank_order[r['name']] = r.get('position', 0)

          members = []
          for m in members_raw:
              user = m.get('user', {})
              if user.get('bot'):
                  continue

              # Find highest role
              highest_role = None
              highest_pos = -1
              for role_id in m.get('roles', []):
                  role = role_map.get(role_id)
                  if role and role.get('position', 0) > highest_pos and role['name'] != '@everyone':
                      highest_pos = role['position']
                      highest_role = role['name']

              # Build avatar URL
              avatar_url = None
              avatar_hash = user.get('avatar')
              user_id = user.get('id')
              if avatar_hash and user_id:
                  ext = 'gif' if avatar_hash.startswith('a_') else 'png'
                  avatar_url = f'https://cdn.discordapp.com/avatars/{user_id}/{avatar_hash}.{ext}?size=128'

              members.append({
                  'name': m.get('nick') or user.get('global_name') or user.get('username', '???'),
                  'username': user.get('username', ''),
                  'avatar': avatar_url,
                  'rank': highest_role or 'Mitglied',
                  'joined_at': m.get('joined_at', '')
              })

          members.sort(key=lambda m: rank_order.get(m['rank'], 0), reverse=True)

          output = {
              'guild_id': '$DISCORD_GUILD_ID',
              'member_count': len(members),
              'updated_at': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              'members': members
          }

          with open('members.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Successfully fetched {len(members)} members")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add members.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Discord member list [automated]"
            git push
          fi
