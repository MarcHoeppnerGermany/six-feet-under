name: Update Discord Members

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  update-members:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/lotr-tribe-website-2qArB

      - name: Fetch Discord Members
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '531795681623670785'
        run: |
          python3 << 'SCRIPT'
          import urllib.request
          import json
          import os
          import sys

          token = os.environ.get('DISCORD_BOT_TOKEN')
          guild_id = os.environ.get('DISCORD_GUILD_ID')

          if not token:
              print("ERROR: DISCORD_BOT_TOKEN not set")
              sys.exit(1)

          headers = {
              'Authorization': f'Bot {token}',
              'Content-Type': 'application/json'
          }

          all_members = []
          after = '0'
          limit = 1000

          while True:
              url = f'https://discord.com/api/v10/guilds/{guild_id}/members?limit={limit}&after={after}'
              req = urllib.request.Request(url, headers=headers)

              try:
                  with urllib.request.urlopen(req) as resp:
                      batch = json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"HTTP Error {e.code}: {e.read().decode()}")
                  sys.exit(1)

              if not batch:
                  break

              for m in batch:
                  user = m.get('user', {})
                  if user.get('bot'):
                      continue

                  member = {
                      'name': m.get('nick') or user.get('global_name') or user.get('username', '???'),
                      'username': user.get('username', ''),
                      'avatar': None,
                      'roles': m.get('roles', []),
                      'joined_at': m.get('joined_at', ''),
                      'status': 'member'
                  }

                  # Build avatar URL
                  avatar_hash = user.get('avatar')
                  user_id = user.get('id')
                  if avatar_hash and user_id:
                      ext = 'gif' if avatar_hash.startswith('a_') else 'png'
                      member['avatar'] = f'https://cdn.discordapp.com/avatars/{user_id}/{avatar_hash}.{ext}?size=128'

                  all_members.append(member)

              if len(batch) < limit:
                  break
              after = batch[-1]['user']['id']

          # Now fetch roles to identify ranks
          url = f'https://discord.com/api/v10/guilds/{guild_id}/roles'
          req = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(req) as resp:
                  roles = json.loads(resp.read().decode())
          except urllib.error.HTTPError:
              roles = []

          # Build role lookup (sorted by position, highest first)
          role_map = {r['id']: r for r in roles}
          roles_sorted = sorted(roles, key=lambda r: r.get('position', 0), reverse=True)

          # Assign highest role name to each member
          for member in all_members:
              highest_role = None
              highest_pos = -1
              for role_id in member['roles']:
                  role = role_map.get(role_id)
                  if role and role.get('position', 0) > highest_pos and role['name'] != '@everyone':
                      highest_pos = role['position']
                      highest_role = role['name']

              member['rank'] = highest_role or 'Mitglied'
              # Remove raw role IDs from output
              del member['roles']

          # Sort: by rank position (leaders first)
          rank_order = {}
          for r in roles_sorted:
              if r['name'] != '@everyone':
                  rank_order[r['name']] = r.get('position', 0)

          all_members.sort(key=lambda m: rank_order.get(m['rank'], 0), reverse=True)

          output = {
              'guild_id': guild_id,
              'member_count': len(all_members),
              'updated_at': __import__('datetime').datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC'),
              'members': all_members
          }

          with open('members.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Successfully fetched {len(all_members)} members")
          SCRIPT

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add members.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Discord member list [automated]"
            git push
          fi
