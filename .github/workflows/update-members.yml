name: Update Discord Members

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  update-members:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/lotr-tribe-website-2qArB

      - name: Fetch Discord Members
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '531795681623670785'
        run: |
          python3 fetch_members.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add members.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Discord member list [automated]"
            git push
          fi
