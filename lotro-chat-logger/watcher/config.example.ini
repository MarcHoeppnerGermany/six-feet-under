[watcher]
# Path to the LOTRO chat log file
# Windows example: C:\Users\YourName\Documents\The Lord of the Rings Online\chatlog.txt
file = C:\Users\YourName\Documents\The Lord of the Rings Online\chatlog.txt

# Your Cloudflare Worker URL
api_url = https://lotro-chat.your-subdomain.workers.dev

# Secret API key (must match the one configured in the Worker)
api_key = your-secret-api-key-here

# How often to check for new lines (seconds)
poll_interval = 2

# How many lines to send per batch
batch_size = 20
